name: test
on:
  push:
  pull_request:
jobs:
  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m cek_hw.cli vectors
      - run: python -m cek_hw.cli doctor
